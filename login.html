<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giprince - Login</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --success: #10b981;
      --danger: #ef4444;
      --dark: #0f172a;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --white: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1);
      --radius: 16px;
      --radius-sm: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
      20%, 40%, 60%, 80% { transform: translateX(4px); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      animation: fadeInUp 0.6s ease-out;
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: var(--shadow-xl);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #8b5cf6, #ec4899);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeIn 0.8s ease-out 0.2s both;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      animation: float 3s ease-in-out infinite;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
    }

    .brand-logo i {
      font-size: 32px;
      color: white;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tagline {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
      animation: slideInLeft 0.5s ease-out both;
    }
    .form-group:nth-child(1) { animation-delay: 0.3s; }
    .form-group:nth-child(2) { animation-delay: 0.4s; }
    .form-group:nth-child(3) { animation-delay: 0.5s; }

    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
    }

    .form-label i {
      font-size: 14px;
      color: var(--primary);
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      background: var(--gray-50);
      color: var(--gray-900);
      font-size: 15px;
      font-family: inherit;
      transition: var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--white);
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    .form-input::placeholder {
      color: var(--gray-400);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 18px;
      transition: var(--transition);
    }

    .form-input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--primary);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray-400);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      transition: var(--transition);
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      animation: slideInLeft 0.5s ease-out 0.6s both;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary.loading .btn-text {
      display: none;
    }

    .btn-primary.loading::after {
      content: '';
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      animation: fadeIn 0.5s ease-out 0.7s both;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    .divider-text {
      font-size: 12px;
      color: var(--gray-400);
      font-weight: 500;
    }

    .links {
      text-align: center;
      margin-top: 24px;
      animation: fadeIn 0.5s ease-out 0.8s both;
    }

    .link {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .link-secondary {
      color: var(--gray-500);
      font-size: 13px;
    }

    .link-secondary:hover {
      color: var(--gray-700);
    }

    .signup-prompt {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--gray-100);
      text-align: center;
      animation: fadeIn 0.5s ease-out 0.9s both;
    }

    .signup-prompt p {
      font-size: 14px;
      color: var(--gray-500);
    }

    .signup-prompt a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .signup-prompt a:hover {
      text-decoration: underline;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 28px;
      animation: fadeIn 0.5s ease-out 1s both;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .feature i {
      font-size: 20px;
      color: var(--primary);
    }

    .feature span {
      font-size: 11px;
      color: var(--gray-500);
      font-weight: 500;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--dark);
      color: white;
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      z-index: 400;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.shake { animation: shake 0.5s ease; }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      animation: slideInLeft 0.5s ease-out 0.55s both;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-wrapper input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-wrapper span {
      font-size: 13px;
      color: var(--gray-600);
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
      .brand-name { font-size: 24px; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <div class="brand-logo">
          <i class="bi bi-lightning-charge-fill"></i>
        </div>
        <div class="brand-name">Giprince</div>
        <div class="brand-tagline">Your All-in-One VTU Platform</div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">
            <i class="bi bi-envelope-fill"></i>
            Email Address
          </label>
          <div class="input-wrapper">
            <input type="email" class="form-input" id="email" placeholder="Enter your email" required autocomplete="email">
            <i class="bi bi-envelope input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            <i class="bi bi-shield-lock-fill"></i>
            Password
          </label>
          <div class="input-wrapper">
            <input type="password" class="form-input" id="password" placeholder="Enter your password" required autocomplete="current-password">
            <i class="bi bi-lock-fill input-icon"></i>
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <i class="bi bi-eye-slash" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="/forgot-password.html" class="link link-secondary">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR</span>
        <div class="divider-line"></div>
      </div>

      <div class="signup-prompt">
        <p>Don't have an account? <a href="/register.html">Create Account</a></p>
      </div>

      <div class="features">
        <div class="feature">
          <i class="bi bi-shield-check"></i>
          <span>Secure</span>
        </div>
        <div class="feature">
          <i class="bi bi-lightning-charge"></i>
          <span>Instant</span>
        </div>
        <div class="feature">
          <i class="bi bi-headset"></i>
          <span>24/7 Support</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = '';

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye-slash';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('token', data.token);
        if (document.getElementById('rememberMe').checked) {
          localStorage.setItem('rememberEmail', email);
        }
        showToast('Welcome back! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/dashboard.html', 1200);
      } catch (err) {
        showToast(err.message, 'error');
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 500);
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.innerHTML = `<i class="bi bi-${type === 'success' ? 'check-circle-fill' : 'exclamation-circle-fill'}"></i> ${message}`;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Auto-fill remembered email
    document.addEventListener('DOMContentLoaded', () => {
      const remembered = localStorage.getItem('rememberEmail');
      if (remembered) {
        document.getElementById('email').value = remembered;
        document.getElementById('rememberMe').checked = true;
      }
    });
  </script>
</body>
</html>
